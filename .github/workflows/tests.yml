name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # The CPU-only PyTorch build is far smaller than the default CUDA one.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      # The real Phi-2 and real Gemini tests are skipped here. A tiny random Phi
      # model (a few MB) checks the real transformers code path instead.
      - name: Run tests
        env:
          RUN_TINY_MODEL: "1"
        run: python -m pytest -q

  space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: space/requirements.txt

      # The same versions as the Hugging Face Space; Gradio comes from its sdk_version.
      - name: Install dependencies
        run: pip install -r space/requirements.txt gradio==6.28.0 pytest --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run the Space app and core tests
        run: >-
          python -m pytest -q tests/test_space_app.py tests/test_graph.py tests/test_explain.py
          tests/test_data.py tests/test_verify.py tests/test_pipeline.py tests/test_llm.py
          tests/test_synth.py tests/test_evaluate.py
